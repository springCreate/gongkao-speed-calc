<script>
// ==================== DATA STORE ====================
const STORAGE_KEY = 'gongkao_speed_calc';
let state = loadState();

function defaultState() {
  return {
    featureProficiency: {}, // { "1_3": { correct: 0, wrong: 0 }, ... }
    calcHistory: [], // [{ type, difficulty, score, total, avgTime, date, details }]
    customQuestions: [], // [{ material, question, options, answer, explanation }]
    wrongQuestions: [], // [{ type, source, question, options, answer, userAnswer, explanation, date }]
    dailyStats: {}, // { "2024-01-15": { count: 3, correct: 25, total: 30, totalTime: 180 } }
    challengeBest: 0
  };
}

function loadState() {
  try {
    const s = localStorage.getItem(STORAGE_KEY);
    if (s) { const d = JSON.parse(s); return { ...defaultState(), ...d }; }
  } catch(e) {}
  return defaultState();
}

function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) {}
}

function todayKey() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function ensureTodayStats() {
  const k = todayKey();
  if (!state.dailyStats[k]) state.dailyStats[k] = { count: 0, correct: 0, total: 0, totalTime: 0 };
}

// ==================== FEATURE NUMBERS DATABASE ====================

function fracKey(num, den) { return `${num}_${den}`; }
function gcd(a, b) { return b === 0 ? a : gcd(b, a % b); }
function simplify(num, den) {
  const g = gcd(num, den);
  return { num: num / g, den: den / g };
}

// ==================== UTILITY ====================
function showToast(msg, color = '#1e3a5f') {
  const t = document.createElement('div');
  t.className = 'toast';
  t.style.background = color;
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2000);
}

function formatTime(sec) {
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return `${m}:${String(s).padStart(2, '0')}`;
}

function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function randChoice(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function shuffle(arr) { const a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function getLevel(score) {
  if (score >= 90) return { name: '大师', color: '#f59e0b', icon: '👑' };
  if (score >= 80) return { name: '精通', color: '#8b5cf6', icon: '🎯' };
  if (score >= 65) return { name: '熟练', color: '#10b981', icon: '📈' };
  if (score >= 45) return { name: '入门', color: '#3b82f6', icon: '📖' };
  return { name: '菜鸟', color: '#6b7280', icon: '🐣' };
}

function getOverallScore() {
  const stats = Object.values(state.dailyStats);
  if (stats.length === 0) return 0;
  const totalQ = stats.reduce((a, b) => a + b.total, 0);
  const totalC = stats.reduce((a, b) => a + b.correct, 0);
  return totalQ === 0 ? 0 : Math.round(totalC / totalQ * 100);
}

// ==================== TAB NAVIGATION ====================
let currentTab = 'home';

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
  document.getElementById(`tab-${tab}`).classList.add('active');
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.classList.toggle('text-[#1e3a5f]', btn.dataset.tab === tab);
    btn.classList.toggle('text-gray-400', btn.dataset.tab !== tab);
  });
  if (tab === 'home') renderDashboard();
  else if (tab === 'feature') { currentFeatureMode = 'browse'; renderFeature(); }
  else if (tab === 'calc') renderCalcMenu();
  else if (tab === 'bank') renderBank();
}

// ==================== DASHBOARD ====================
let lineChart = null, radarChart = null;

function renderDashboard() {
  const el = document.getElementById('dashboard-content');
  const now = new Date();
  const weekDays = ['周日','周一','周二','周三','周四','周五','周六'];
  const todayS = state.dailyStats[todayKey()] || { count: 0, correct: 0, total: 0, totalTime: 0 };
  const score = getOverallScore();
  const level = getLevel(score);
  const wrongCount = state.wrongQuestions.length;

  el.innerHTML = `
    <div class="mb-4">
      <h2 class="text-xl font-bold text-[#1e3a5f]">欢迎回来！</h2>
      <p class="text-gray-500 text-sm">${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 ${weekDays[now.getDay()]}</p>
    </div>
    <div class="bg-gradient-to-r from-[#1e3a5f] to-[#2d5a8e] rounded-xl p-4 text-white mb-4 card-shadow">
      <div class="flex items-center justify-between mb-3">
        <span class="text-sm text-gray-300">当前等级</span>
        <span class="level-badge bg-white/20">${level.icon} ${level.name}</span>
      </div>
      <div class="flex justify-around text-center">
        <div><div class="text-2xl font-bold">${todayS.count}</div><div class="text-xs text-gray-300">今日练习</div></div>
        <div><div class="text-2xl font-bold">${todayS.total ? Math.round(todayS.correct/todayS.total*100) : 0}%</div><div class="text-xs text-gray-300">正确率</div></div>
        <div><div class="text-2xl font-bold">${todayS.totalTime ? formatTime(todayS.totalTime) : '0:00'}</div><div class="text-xs text-gray-300">总用时</div></div>
      </div>
    </div>
    ${wrongCount > 0 ? `
    <div class="bg-red-50 border border-red-200 rounded-xl p-3 mb-4 flex items-center justify-between">
      <span class="text-red-600 text-sm font-medium">⚠️ 有 ${wrongCount} 道错题待复习</span>
      <button onclick="switchTab('calc');startWrongReview()" class="btn-press bg-red-500 text-white text-xs px-3 py-1.5 rounded-lg">去复习</button>
    </div>` : ''}
    <div class="grid grid-cols-2 gap-3 mb-4">
      <button onclick="switchTab('feature');switchFeatureMode('flashcard')" class="btn-press bg-white rounded-xl p-4 card-shadow text-left">
        <div class="text-2xl mb-2">📊</div>
        <div class="font-semibold text-[#1e3a5f] text-sm">敏感数速记</div>
        <div class="text-xs text-gray-400 mt-1">闪卡/限时挑战</div>
      </button>
      <button onclick="switchTab('calc')" class="btn-press bg-white rounded-xl p-4 card-shadow text-left">
        <div class="text-2xl mb-2">⚡</div>
        <div class="font-semibold text-[#1e3a5f] text-sm">速算训练</div>
        <div class="text-xs text-gray-400 mt-1">6种题型可选</div>
      </button>
      <button onclick="switchTab('bank')" class="btn-press bg-white rounded-xl p-4 card-shadow text-left">
        <div class="text-2xl mb-2">📝</div>
        <div class="font-semibold text-[#1e3a5f] text-sm">题目导入</div>
        <div class="text-xs text-gray-400 mt-1">自定义题库</div>
      </button>
      <button onclick="showShareModal()" class="btn-press bg-white rounded-xl p-4 card-shadow text-left">
        <div class="text-2xl mb-2">🏆</div>
        <div class="font-semibold text-[#1e3a5f] text-sm">分享成绩</div>
        <div class="text-xs text-gray-400 mt-1">生成海报</div>
      </button>
    </div>
    <div class="bg-white rounded-xl p-4 card-shadow mb-4">
      <h3 class="font-semibold text-[#1e3a5f] text-sm mb-3">最近7天正确率</h3>
      <canvas id="lineChart" height="180"></canvas>
    </div>
    <div class="bg-white rounded-xl p-4 card-shadow mb-4">
      <h3 class="font-semibold text-[#1e3a5f] text-sm mb-3">各题型能力雷达</h3>
      <canvas id="radarChart" height="250"></canvas>
    </div>
  `;

  // Line chart
  const labels = [];
  const data7 = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date(); d.setDate(d.getDate() - i);
    const k = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const ds = state.dailyStats[k];
    labels.push(`${d.getMonth()+1}/${d.getDate()}`);
    data7.push(ds && ds.total > 0 ? Math.round(ds.correct / ds.total * 100) : 0);
  }

  const lineCtx = document.getElementById('lineChart');
  if (lineChart) lineChart.destroy();
  lineChart = new Chart(lineCtx, {
    type: 'line',
    data: {
      labels,
      datasets: [{
        label: '正确率%',
        data: data7,
        borderColor: '#1e3a5f',
        backgroundColor: 'rgba(30,58,95,0.1)',
        fill: true, tension: 0.4, pointRadius: 4,
        pointBackgroundColor: '#1e3a5f'
      }]
    },
    options: {
      responsive: true, plugins: { legend: { display: false } },
      scales: {
        y: { min: 0, max: 100, ticks: { callback: v => v + '%' } },
        x: { grid: { display: false } }
      }
    }
  });

  // Radar chart
  const typeNames = ['截位直除', '特征数字', '基期量', '增长量', '比重差', '分数比较'];
  const radarData = typeNames.map((name, i) => {
    const history = state.calcHistory.filter(h => h.typeIdx === i);
    if (history.length === 0) return 0;
    const avg = history.reduce((a, b) => a + b.score / b.total, 0) / history.length;
    return Math.round(avg);
  });

  const radarCtx = document.getElementById('radarChart');
  if (radarChart) radarChart.destroy();
  radarChart = new Chart(radarCtx, {
    type: 'radar',
    data: {
      labels: typeNames,
      datasets: [{
        label: '能力值',
        data: radarData,
        backgroundColor: 'rgba(30,58,95,0.15)',
        borderColor: '#1e3a5f', pointBackgroundColor: '#f59e0b',
        pointRadius: 4
      }]
    },
    options: {
      responsive: true,
      scales: { r: { min: 0, max: 100, ticks: { stepSize: 25, display: false } } },
      plugins: { legend: { display: false } }
    }
  });
}

// ==================== FEATURE NUMBERS MODULE ====================
let currentFeatureMode = 'browse';
let flashcardData = null;
let challengeTimer = null;
let challengeState = null;

function switchFeatureMode(mode) {
  currentFeatureMode = mode;
  document.querySelectorAll('.sub-tab').forEach(el => el.classList.remove('active'));
  event.target.classList.add('active');
  if (mode === 'challenge' && challengeTimer) { clearInterval(challengeTimer); challengeTimer = null; }
  renderFeature();
}

function renderFeature() {
  const el = document.getElementById('feature-content');
  if (currentFeatureMode === 'browse') renderFeatureBrowse(el);
  else if (currentFeatureMode === 'flashcard') renderFeatureFlashcard(el);
  else if (currentFeatureMode === 'challenge') renderFeatureChallenge(el);
  else if (currentFeatureMode === 'progress') renderFeatureProgress(el);
}

function renderFeatureBrowse(el) {
  const grouped = {};
  FRACTION_DB.forEach(f => {
    if (!grouped[f.den]) grouped[f.den] = [];
    grouped[f.den].push(f);

  const wrongs = shuffle(wrongPool).slice(0, 3);
  const options = shuffle([correct, ...wrongs]);
  challengeState.current = { ...correct, options };

  challengeState = { score: 0, total: 0, timeLeft: 60, current: null, started: true };
  challengeNextQuestion();
  challengeTimer = setInterval(() => {
    challengeState.timeLeft--;
    const timerEl = document.querySelector('.text-red-600.font-mono');
    if (timerEl) timerEl.textContent = challengeState.timeLeft + 's';
    if (challengeState.timeLeft <= 0) {
      clearInterval(challengeTimer); challengeTimer = null;
      endChallenge();
    }
  }, 1000);
  renderFeature();
}

function answerChallenge(idx) {
  if (!challengeState || !challengeState.started) return;
  const c = challengeState;
  const selected = c.current.options[idx];
  c.total++;
  const isCorrect = selected.num === c.current.num && selected.den === c.current.den;
  if (isCorrect) c.score++;

  // Update proficiency
  const sk = fracKey(c.current.num, c.current.den);
  if (!state.featureProficiency[sk]) state.featureProficiency[sk] = { correct: 0, wrong: 0 };
  if (isCorrect) state.featureProficiency[sk].correct++;
  else state.featureProficiency[sk].wrong++;
  saveState();

  // Visual feedback
  const btns = document.querySelectorAll('.option-btn');
  btns.forEach((btn, i) => {
    if (i === idx) btn.classList.add(isCorrect ? 'correct' : 'wrong');
    if (c.current.options[i].num === c.current.num && c.current.options[i].den === c.current.den && i !== idx) {
      btn.classList.add('correct');
    }
  });

  ensureTodayStats();
  state.dailyStats[todayKey()].count++;
  if (isCorrect) state.dailyStats[todayKey()].correct++;
  state.dailyStats[todayKey()].total++;
  saveState();

  setTimeout(() => {
    challengeNextQuestion();
    renderFeature();
  }, 400);
}

function generateCalcQuestions(typeIdx, difficulty) {
  const questions = [];
  for (let q = 0; q < 10; q++) {
    let question = null;
    switch(typeIdx) {
      case 0: question = genTruncateQ(difficulty); break;
      case 1: question = genFeatureQ(difficulty); break;
      case 2: question = genBaseQ(difficulty); break;
      case 3: question = genGrowthQ(difficulty); break;
      case 4: question = genWeightQ(difficulty); break;
      case 5: question = genCompareQ(difficulty); break;
    }
    if (question) questions.push(question);
  }
  return questions;
}

function makeOptions(correct, range, decimals = 0) {
  const precision = Math.pow(10, decimals);
  const correctRounded = Math.round(correct * precision) / precision;
  const optsSet = new Set([correctRounded]);
  let attempts = 0;
  while (optsSet.size < 4 && attempts < 500) {
    const offset = (Math.random() < 0.5 ? -1 : 1) * (randInt(1, Math.max(range, 5)) / precision);
    const val = Math.round((correctRounded + offset) * precision) / precision;
    if (val !== correctRounded) optsSet.add(val);
    attempts++;
  }
  // Fallback: if still not enough unique options, force generate
  if (optsSet.size < 4) {
    for (let i = 1; optsSet.size < 4; i++) {
      optsSet.add(Math.round((correctRounded + i * 1.1) * precision) / precision);
      optsSet.add(Math.round((correctRounded - i * 1.1) * precision) / precision);
    }
  }
  const labels = ['A', 'B', 'C', 'D'];
  let arr = Array.from(optsSet).slice(0, 4);
  arr = shuffle(arr);
  const correctIdx = arr.indexOf(correctRounded);
  return arr.map((v, i) => ({ label: labels[i], value: v, correct: i === correctIdx }));
}

function formatNum(n) { return n.toLocaleString('zh-CN', { maximumFractionDigits: 2 }); }

// Q1: Truncate division
function genTruncateQ(difficulty) {
  const digitLevels = [2, 3, 3];
  const digits = digitLevels[difficulty];
  const divRange = difficulty === 0 ? [2, 5] : difficulty === 1 ? [3, 9] : [7, 15];
  const den = randInt(divRange[0], divRange[1]);
  const num = randInt(Math.round(den * 1.5), den * digits);
  const exact = num / den;
  const truncNum = parseInt(String(num).substring(0, digits));
  const truncDen = parseInt(String(den).substring(0, Math.min(2, String(den).length)));
  const truncResult = truncNum / truncDen;
  const correct = Math.round(truncResult * 10) / 10;
  return {
    question: `截位计算：${formatNum(num)} ÷ ${formatNum(den)} ≈ ？`,
    hint: `截取前${digits}位估算`,
    options: makeOptions(correct, difficulty === 0 ? 3 : difficulty === 1 ? 5 : 8, 1),
    correct,
    explanation: `截取前${digits}位：${truncNum} ÷ ${truncDen} ≈ ${correct}，精确值${exact.toFixed(2)}`
  };
}

// Q2: Feature number
function genFeatureQ(difficulty) {
  const frac = randChoice(FRACTION_DB);
  const baseVal = difficulty === 0 ? randInt(100, 500) : difficulty === 1 ? randInt(1000, 5000) : randInt(10000, 50000);
  const rate = frac.pct;
  const result = Math.round(baseVal * frac.num / frac.den);
  const opts = makeOptions(result, difficulty === 0 ? 50 : difficulty === 1 ? 200 : 500);
  return {
    question: `${formatNum(baseVal)} × ${rate}% = ？\n（提示：${rate}% = ${frac.num}/${frac.den}）`,
    hint: `${rate}% 转化为 ${frac.num}/${frac.den}，乘法变除法`,
    options: opts,
    correct: result,
    explanation: `${rate}% = ${frac.num}/${frac.den}，所以 ${formatNum(baseVal)} × ${frac.num}/${frac.den} = ${baseVal * frac.num} ÷ ${frac.den} = ${formatNum(result)}`
  };
}

// Q3: Base period (按真题规律：60%整数、30%一位小数、10%两位小数)
function genBaseQ(difficulty) {
  const current = difficulty === 0 ? randInt(200, 999) : difficulty === 1 ? randInt(2000, 9999) : randInt(10000, 99999);
  const rate = randChoice([3.2, 5.1, 7.3, 8.5, 9.8, 11.1, 12.5, 14.3, 16.7, 20, 25, 33.3]);
  const exact = current / (1 + rate / 100);
  // 按真题规律：60%整数 30%一位小数 10%两位小数
  const r = Math.random();
  let correct, decimals, range;
  if (r < 0.6) {
    correct = Math.round(exact);
    decimals = 0;
    range = difficulty === 0 ? 15 : difficulty === 1 ? 80 : 300;
  } else if (r < 0.9) {
    correct = Math.round(exact * 10) / 10;
    decimals = 1;
    range = difficulty === 0 ? 8 : difficulty === 1 ? 30 : 100;
  } else {
    correct = Math.round(exact * 100) / 100;
    decimals = 2;
    range = difficulty === 0 ? 3 : difficulty === 1 ? 15 : 50;
  }
  const opts = makeOptions(correct, range, decimals);
  const rateFrac = FRACTION_DB.find(f => f.pct === rate);
  return {
    question: `现期量 ${formatNum(current)}，增长率 ${rate}%\n基期量约为？`,
    hint: `基期 = 现期 ÷ (1+r%)${rateFrac ? `，${rate}% ≈ 1/${rateFrac.den}` : ''}`,
    options: opts,
    correct,
    explanation: `基期 = ${formatNum(current)} ÷ (1+${rate}%) ≈ ${formatNum(current)} ÷ ${(1 + rate/100).toFixed(3)} ≈ ${decimals === 0 ? formatNum(correct) : correct.toFixed(decimals)}`
  };
}

// Q4: Growth amount (按真题规律：答案绝大多数为整数)
function genGrowthQ(difficulty) {
  const current = difficulty === 0 ? randInt(200, 999) : difficulty === 1 ? randInt(2000, 9999) : randInt(10000, 99999);
  const rate = randChoice([3.2, 5.1, 7.3, 8.5, 9.8, 11.1, 12.5, 14.3, 16.7, 20]);
  const exact = current * rate / 100 / (1 + rate / 100);
  const correct = Math.round(exact);
  const opts = makeOptions(correct, difficulty === 0 ? 10 : difficulty === 1 ? 50 : 200);
  return {
    question: `现期量 ${formatNum(current)}，增长率 ${rate}%\n增长量约为？`,
    hint: `增长量 = 现期 × r% ÷ (1+r%)${rate <= 20 ? `，n/(1+n%) 是特征数字法` : ''}`,
    options: opts,
    correct,
    explanation: `增长量 = ${formatNum(current)} × ${rate}% ÷ (1+${rate}%) = ${exact.toFixed(1)} ≈ ${formatNum(correct)}`
  };
}

// Q5: Weight difference
function genWeightQ(difficulty) {
  // 生成两个比重，差值在合理范围内（初级3-15个百分点，中级5-25，高级10-40）
  const diffRange = difficulty === 0 ? [3, 15] : difficulty === 1 ? [5, 25] : [10, 40];
  const targetDiff = randInt(diffRange[0], diffRange[1]);
  // A/B 的值在 20%~90% 之间
  const r1Pct = randInt(20, 85);
  const r2Pct = r1Pct + (Math.random() < 0.5 ? targetDiff : -targetDiff);
  // 生成对应数值
  const d = difficulty === 0 ? 10 : difficulty === 1 ? 100 : 1000;
  const b = randInt(5, 20) * d + randInt(0, d - 1);
  const a = Math.round(b * r1Pct / 100);
  const dd = randInt(5, 20) * d + randInt(0, d - 1);
  const c = Math.round(dd * r2Pct / 100);
  if (a <= 0 || c <= 0) return genWeightQ(difficulty); // 确保数值为正
  const r1 = a / b, r2 = c / dd;
  const diff = r1 - r2;
  const correct = Math.round(diff * 1000) / 10;
  const opts = makeOptions(correct, Math.max(5, Math.abs(Math.round(targetDiff / 2))), 1);
  return {
    question: `求比重差：${formatNum(a)}/${formatNum(b)} - ${formatNum(c)}/${formatNum(dd)} ≈ ？（百分点）`,
    hint: `分别估算两个比重值，再相减`,
    options: opts,
    correct,
    explanation: `${formatNum(a)}/${formatNum(b)} ≈ ${(r1*100).toFixed(1)}%，${formatNum(c)}/${formatNum(dd)} ≈ ${(r2*100).toFixed(1)}%，差 ≈ ${correct}个百分点`
  };
}

// Q6: Fraction comparison
function genCompareQ(difficulty) {
  const d = difficulty === 0 ? 1 : difficulty === 1 ? 10 : 100;
  let n1, d1, n2, d2;
  do {
    n1 = randInt(2, 9) * d + (d > 1 ? randInt(0, 9) * (d/10) : 0);
    d1 = randInt(3, 9) * d + (d > 1 ? randInt(0, 9) * (d/10) : 0);
    n2 = randInt(2, 9) * d + (d > 1 ? randInt(0, 9) * (d/10) : 0);
    d2 = randInt(3, 9) * d + (d > 1 ? randInt(0, 9) * (d/10) : 0);
  } while (n1 === n2 && d1 === d2);

  n1 = Math.round(n1); d1 = Math.round(d1); n2 = Math.round(n2); d2 = Math.round(d2);
  const r1 = n1 / d1, r2 = n2 / d2;
  const correct = r1 > r2 ? 'A > B' : r1 < r2 ? 'A < B' : 'A = B';
  return {
    question: `比较大小：A = ${formatNum(n1)}/${formatNum(d1)}，B = ${formatNum(n2)}/${formatNum(d2)}`,
    hint: `可尝试化同分子或同分母比较，或交叉相乘`,
    options: [
      { label: 'A', value: 'A > B', correct: correct === 'A > B' },
      { label: 'B', value: 'A < B', correct: correct === 'A < B' },
      { label: 'C', value: 'A = B', correct: correct === 'A = B' },
    ],
    correct,
    explanation: `A = ${(r1*100).toFixed(2)}%，B = ${(r2*100).toFixed(2)}%，所以 ${correct}`
  };
}

}

function answerCalcQuestion(idx) {
  const s = calcSession;
  if (!s || s.finished) return;
  const q = s.questions[s.currentQ];
  const selectedOpt = q.options[idx];
  const isCorrect = selectedOpt.correct;

  const qTime = Math.floor((Date.now() - s.questionStart) / 1000);
  s.answers.push({ selected: idx, correct: isCorrect, time: qTime });

  // Visual feedback
  const btns = document.querySelectorAll('.option-btn');
  btns.forEach((btn, i) => {
    if (q.options[i].correct) btn.classList.add('correct');
    if (i === idx && !isCorrect) btn.classList.add('wrong');
    btn.onclick = null;
  });

  // 错题复习模式：答对移除错题，答错保留（不重复添加）
  if (s.isReview) {
    if (isCorrect && s.wrongIndices && s.wrongIndices[s.currentQ] !== undefined) {
      // 按原始错题本索引移除已答对的题
      state.wrongQuestions.splice(s.wrongIndices[s.currentQ], 1);
      // 移除后，后续索引全部减1
      for (let k = s.currentQ + 1; k < s.wrongIndices.length; k++) {
        if (s.wrongIndices[k] !== undefined) s.wrongIndices[k]--;
      }
      saveState();
    }
    // 答错的不做任何操作（保留在错题本，不重复添加）
  } else {
    // 普通练习模式：记录错题（保存完整选项含label和correct标记）
    if (!isCorrect) {
      state.wrongQuestions.push({
        type: 'calc', typeIdx: s.typeIdx,
        question: q.question, options: q.options.map(o => o.value),
        optionLabels: q.options.map(o => o.label),
        correctIdx: q.options.findIndex(o => o.correct),
        correct: q.correct, userAnswer: q.options[idx].value,
        explanation: q.explanation, date: todayKey()
      });
      saveState();
    }
  }

  setTimeout(() => {
    s.currentQ++;
    s.questionStart = Date.now();
    const totalQ = s.isReview ? s.questions.length : 10;
    if (s.currentQ >= totalQ) {
      finishCalcSession();
    } else {
      renderCalcQuestion();
    }
  }, 600);
}

function finishCalcSession() {
  const s = calcSession;
  if (s.questionTimer) { clearInterval(s.questionTimer); s.questionTimer = null; }
  s.finished = true;

  const score = s.answers.filter(a => a.correct).length;
  const totalQ = s.isReview ? s.questions.length : 10;
  const totalTime = Math.floor((Date.now() - s.startTime) / 1000);
  const avgTime = s.answers.length > 0 ? Math.round(s.answers.reduce((a, b) => a + b.time, 0) / s.answers.length) : 0;

  // Save history
  state.calcHistory.push({
    typeIdx: s.typeIdx, difficulty: s.difficulty,
    score, total: totalQ, avgTime,
    date: todayKey(), details: s.answers, isReview: s.isReview
  });

  // Save daily stats
  ensureTodayStats();
  state.dailyStats[todayKey()].count++;
  state.dailyStats[todayKey()].correct += score;
  state.dailyStats[todayKey()].total += totalQ;
  state.dailyStats[todayKey()].totalTime += totalTime;
  saveState();

  renderCalcResult(s, score, totalQ, avgTime, totalQ);
}

function endCalcSessionEarly() {
  if (calcSession) {
    if (calcSession.questionTimer) { clearInterval(calcSession.questionTimer); calcSession.questionTimer = null; }
    if (calcSession.answers.length > 0 && !calcSession.finished) {
      finishCalcSession();
    } else {
      calcSession = null;
      renderCalcMenu();
    }
  }
}

function startWrongReview() {
  if (state.wrongQuestions.length === 0) { showToast('没有错题！'); return; }
  const wrongList = state.wrongQuestions.slice(); // 复制当前所有错题
  const wrongIndices = wrongList.map((_, i) => i); // 记录在原数组中的索引
  calcSession = {
    typeIdx: -1, difficulty: 0,
    questions: wrongList.map(wq => {
      // 优先用正确答案索引（新记录），回退用值匹配（旧记录兼容）
      let correctIdx = wq.correctIdx;
      if (correctIdx === undefined) {
        correctIdx = wq.options.findIndex(v =>
          typeof v === 'number' ? Math.abs(v - wq.correct) < 0.001 : v === wq.correct
        );
      }
      if (correctIdx < 0) correctIdx = 0;
      return {
        question: wq.question,
        options: wq.options.map((v, i) => ({
          label: wq.optionLabels ? wq.optionLabels[i] : ['A','B','C','D'][i],
          value: v, correct: i === correctIdx
        })),
        correct: wq.correct,
        explanation: wq.explanation
      };
    }),
    wrongIndices, // 记录每道题在 state.wrongQuestions 中的原始索引
    currentQ: 0,
    answers: [],
    startTime: Date.now(),
    questionStart: Date.now(),
    finished: false,
    isReview: true
  };
  renderCalcQuestion();
}

  try {
    const data = JSON.parse(raw);
    if (!Array.isArray(data)) throw new Error('必须为数组');
    let count = 0;
    data.forEach(item => {
      if (item.question && Array.isArray(item.options)) {
        state.customQuestions.push({
          material: item.material || '',
          question: item.question,
          options: item.options,
          answer: item.answer ?? 0,
          explanation: item.explanation || '无解析'
        });
        count++;
      }
    });
    saveState();
    closeModal();
    showToast(`成功导入 ${count} 道题目！`);
    renderBank();
  } catch(e) {
    showToast('JSON格式错误：' + e.message, '#ef4444');
  }
}

function practiceCustomQuestions() {
  if (state.customQuestions.length === 0) { showToast('题库为空'); return; }
  const questions = shuffle(state.customQuestions).slice(0, 10).map(q => ({
    question: q.question + (q.material ? '\n材料：' + q.material : ''),
    options: q.options.map((v, i) => ({ label: ['A','B','C','D'][i], value: v, correct: i === q.answer })),
    correct: q.options[q.answer],
    explanation: q.explanation
  }));
  calcSession = {
    typeIdx: -2, difficulty: 0,
    questions, currentQ: 0,
    answers: [], startTime: Date.now(),
    questionStart: Date.now(), finished: false,
    isCustom: true
  };
  renderCalcQuestion();
}

function deleteQuestion(idx) {
  state.customQuestions.splice(idx, 1);
  saveState();
  renderBank();
}

function clearAllQuestions() {
  if (confirm('确定清空所有导入的题目？')) {
    state.customQuestions = [];
    saveState();
    renderBank();
  }
}

function exportQuestions() {
  const data = JSON.stringify(state.customQuestions, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'gongkao_questions.json'; a.click();
  URL.revokeObjectURL(url);
  showToast('题目已导出为JSON文件');
}

function generateShareCode() {
  if (state.customQuestions.length === 0) { showToast('题库为空'); return; }
  const code = btoa(unescape(encodeURIComponent(JSON.stringify(state.customQuestions))));
  showModal(`
    <div class="p-6">
      <h3 class="text-lg font-bold text-[#1e3a5f] mb-4">分享码</h3>
      <p class="text-sm text-gray-500 mb-3">复制分享码发送给好友，好友粘贴即可导入题目</p>
      <textarea id="share-code-output" rows="4" class="w-full border rounded-lg p-2 text-sm font-mono break-all" readonly>${code}</textarea>
      <div class="flex gap-3 mt-4">
        <button onclick="copyShareCode()" class="btn-press flex-1 bg-[#1e3a5f] text-white rounded-xl py-2.5 font-medium">复制分享码</button>
        <button onclick="closeModal()" class="btn-press flex-1 bg-gray-100 rounded-xl py-2.5">关闭</button>
      </div>
    </div>
  `);
}

function copyShareCode() {
  const el = document.getElementById('share-code-output');
  if (el) {
    navigator.clipboard.writeText(el.value).then(() => showToast('已复制到剪贴板'));
  }
}

function showImportShareCodeModal() {
  showModal(`
    <div class="p-6">
      <h3 class="text-lg font-bold text-[#1e3a5f] mb-4">导入分享码</h3>
      <textarea id="share-code-input" rows="4" class="w-full border rounded-lg p-2 text-sm font-mono" placeholder="粘贴分享码..."></textarea>
      <div class="flex gap-3 mt-4">
        <button onclick="importShareCode()" class="btn-press flex-1 bg-[#1e3a5f] text-white rounded-xl py-2.5 font-medium">导入</button>
        <button onclick="closeModal()" class="btn-press flex-1 bg-gray-100 rounded-xl py-2.5">取消</button>
      </div>
    </div>
  `);
}

function importShareCode() {
  const code = document.getElementById('share-code-input').value.trim();
  if (!code) { showToast('请粘贴分享码', '#ef4444'); return; }
  try {
    const data = JSON.parse(decodeURIComponent(escape(atob(code))));
    if (!Array.isArray(data)) throw new Error('数据格式错误');
    let count = 0;
    data.forEach(item => {
      if (item.question && Array.isArray(item.options)) {
        state.customQuestions.push({
          material: item.material || '',
          question: item.question,
          options: item.options,
          answer: item.answer ?? 0,
          explanation: item.explanation || '无解析'
        });
        count++;
      }
    });
    saveState();
    closeModal();
    showToast(`成功导入 ${count} 道题目！`);
    renderBank();
  } catch(e) {
    showToast('分享码无效：' + e.message, '#ef4444');
  }
}

// ==================== SHARE MODULE ====================
function showShareModal() {
  const score = getOverallScore();
  const level = getLevel(score);
  const todayS = state.dailyStats[todayKey()] || { count: 0, correct: 0, total: 0 };
  const pct = todayS.total > 0 ? Math.round(todayS.correct / todayS.total * 100) : 0;

  const textSummary = `【公考资料分析速算训练】\n等级：${level.icon}${level.name}\n今日练习：${todayS.count}组\n今日正确率：${pct}%\n综合正确率：${score}%\n快来一起训练吧！`;

  showModal(`
    <div class="p-6">
      <h3 class="text-lg font-bold text-[#1e3a5f] mb-4">分享我的成绩</h3>
      <div class="bg-gray-50 rounded-xl p-4 mb-4">
        <div class="flex items-center gap-2 mb-3">
          <span class="level-badge" style="color:${level.color}; background:${level.color}15">${level.icon} ${level.name}</span>
          <span class="text-sm text-gray-500">综合正确率 ${score}%</span>
        </div>
        <div class="text-sm text-gray-600">
          <p>今日练习：${todayS.count}组</p>
          <p>今日正确率：${pct}%</p>
          <p>累计练习：${state.calcHistory.length}组</p>
        </div>
      </div>
      <div class="space-y-3">
        <button onclick="generatePoster()" class="btn-press w-full bg-gradient-to-r from-[#1e3a5f] to-[#2d5a8e] text-white rounded-xl py-3 font-medium">生成分享海报</button>
        <button onclick="navigator.clipboard.writeText(\`${textSummary}\`).then(()=>showToast('已复制成绩摘要'))" class="btn-press w-full bg-white border border-gray-200 rounded-xl py-3 font-medium text-sm">复制成绩文本</button>
      </div>
      <button onclick="closeModal()" class="btn-press w-full mt-3 text-gray-400 text-sm">关闭</button>
    </div>
  `);
}

async function generatePoster() {
  closeModal();
  showToast('正在生成海报...');

  const score = getOverallScore();
  const level = getLevel(score);
  const todayS = state.dailyStats[todayKey()] || { count: 0, correct: 0, total: 0 };
  const pct = todayS.total > 0 ? Math.round(todayS.correct / todayS.total * 100) : 0;

  const posterBody = document.getElementById('poster-body');
  posterBody.innerHTML = `
    <div class="flex items-center gap-3 mb-4">
      <span class="level-badge" style="background:${level.color};color:white">${level.icon} ${level.name}</span>
      <span class="text-white text-lg font-bold">${score}%</span>
    </div>
    <div class="grid grid-cols-3 gap-3 text-center text-white mb-3">
      <div><div class="text-2xl font-bold">${todayS.count}</div><div class="text-xs text-gray-300">今日练习</div></div>
      <div><div class="text-2xl font-bold">${pct}%</div><div class="text-xs text-gray-300">今日正确率</div></div>
      <div><div class="text-2xl font-bold">${state.calcHistory.length}</div><div class="text-xs text-gray-300">累计组数</div></div>
    </div>
    <div class="text-center text-sm text-gray-300">${new Date().toLocaleDateString('zh-CN')}</div>
  `;

  const poster = document.getElementById('share-poster');
  poster.style.left = '-9999px';
  poster.style.display = 'block';

  try {
    const canvas = await html2canvas(poster, {
      backgroundColor: '#1e3a5f',
      scale: 2,
      width: 360,
      height: poster.offsetHeight
    });
    const link = document.createElement('a');
    link.download = 'gongkao_speed_calc_poster.png';
    link.href = canvas.toDataURL();
    link.click();
    showToast('海报已生成并下载！');
  } catch(e) {
    showToast('海报生成失败，请重试', '#ef4444');
  }
  poster.style.display = 'none';
}

// ==================== MODAL ====================
function showModal(content) {
  const overlay = document.getElementById('modal-overlay');
  const modal = document.getElementById('modal-content');
  modal.innerHTML = content;
  overlay.classList.remove('hidden');
  overlay.classList.add('flex');
  overlay.onclick = (e) => { if (e.target === overlay) closeModal(); };
}

function closeModal() {
  const overlay = document.getElementById('modal-overlay');
  overlay.classList.add('hidden');
  overlay.classList.remove('flex');
}

// ==================== INIT ====================
function init() {
  // Set tab button styles
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.classList.add(btn.classList.contains('active') ? 'text-[#1e3a5f]' : 'text-gray-400');
  });
  renderDashboard();
}

init();
</script>
